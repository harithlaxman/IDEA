{# Shared modal shell — backdrop, card, header, and the dwCloseModal hooks:
     {% call modal("rate-modal", "Rate Last Reply") %}...body...{% endcall %} #}
{% macro modal(id, title) %}
<div class="modal" id="{{ id }}">
  <div class="modal-backdrop" onclick="window.dwCloseModal()"></div>
  <div class="modal-card">
    <div class="modal-header">
      <h3>{{ title }}</h3>
      <button class="modal-close" onclick="window.dwCloseModal()">✕</button>
    </div>
    <div class="modal-body">
      {{ caller() }}
    </div>
  </div>
</div>
{% endmacro %}
